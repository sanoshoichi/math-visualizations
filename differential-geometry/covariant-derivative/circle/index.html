<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>単位円の共変微分</title>
<style>
:root{color-scheme:light dark;--vector:light-dark(#1459a4,#8cc5ff);--tangent:light-dark(#08734d,#6ce3b0);--normal:light-dark(#992752,#ff9fbd)}
body{max-width:34rem;margin:auto;padding:1rem;font:1rem/1.5 system-ui,sans-serif}h1{font-size:1.5rem}
.controls{position:sticky;top:0;z-index:2;background:Canvas;padding:.2rem 0;border-bottom:1px solid GrayText}
label{display:flex;align-items:center;gap:.5em;min-height:44px}input{flex:1;min-width:0}
svg{display:block;width:100%;height:220px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:.3em;text-align:right;border-bottom:1px solid GrayText}th:first-child{text-align:left}.formula{text-align:center;font-family:serif;font-size:1.15em}
.vector{color:var(--vector)}.tangent{color:var(--tangent)}.normal{color:var(--normal)}.total{font-weight:600}
</style>
<main>
<nav><a href="../../../">数学の可視化一覧</a> · <a href="../sphere/">単位球面の共変微分</a></nav>
<h1>単位円の共変微分</h1>
<p>円周上の点を動かし、その点で円に接する矢印 <i>Y</i> の変化を見る。</p>
<div class="controls">
<label>円周上の角度 <output id="angle"></output><input id="theta" type="range" min="0" max="360" value="25"></label>
<label>長さの変動幅 <i>a</i> <output id="amplitude"></output><input id="a" type="range" min="0" max=".9" step=".1" value="0"></label>
</div>
<svg viewBox="0 0 320 220" role="img" aria-label="単位円、選んだ点での接線、接ベクトルとその微分の成分">
<circle cx="160" cy="110" r="68" fill="none" stroke="GrayText"/>
<line id="axis" stroke="GrayText" stroke-dasharray="4 4"/>
<path id="guide" fill="none" stroke="GrayText" stroke-dasharray="3 4"/>
<path id="vector" class="vector" fill="none" stroke="currentColor" stroke-width="4"/>
<path id="derivative" fill="none" stroke="currentColor" stroke-width="2"/>
<path id="normal" class="normal" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 2"/>
<path id="tangent" class="tangent" fill="none" stroke="currentColor" stroke-width="2"/>
<circle id="point" r="3" fill="currentColor"/>
</svg>
<p id="observation" aria-live="polite"></p>
<table>
<thead><tr><th scope="col">平面上の成分</th><th scope="col"><i>x</i></th><th scope="col"><i>y</i></th></tr></thead>
<tbody>
<tr class="vector" id="row-vector"><th scope="row">接ベクトル <i>Y</i></th><td></td><td></td></tr>
<tr class="tangent" id="row-tangent"><th scope="row">共変微分（接線成分）</th><td></td><td></td></tr>
<tr class="normal" id="row-normal"><th scope="row">＋ 法線成分</th><td></td><td></td></tr>
<tr class="total" id="row-derivative"><th scope="row">＝ 通常の微分</th><td></td><td></td></tr>
</tbody>
</table>
<details><summary>式と記号</summary>
<p>円周上の角度を <i>θ</i>、接ベクトルの長さを <i>f</i> とする。単位接ベクトルを <i>T</i>、外向き単位法線を <i>N</i> とする。微分はラジアンで測った角度について行う。</p>
<div class="formula"><i>Y</i> = <i>fT</i>　　<i>f</i> = 1 + <i>a</i> sin <i>θ</i></div>
<div class="formula">d<i>Y</i>/d<i>θ</i> = <i>f′T</i> − <i>fN</i></div>
<div class="formula">D<i>Y</i>/d<i>θ</i> = <i>f′T</i></div>
<p>長さが一定でも、矢印の向きは回る。その変化は法線方向に現れる。接線方向に残るのは、長さの変化による成分である。</p>
</details>
</main>
<script>
const get = id => document.getElementById(id);
const angle = get("theta"), amplitude = get("a");
const mul = (v,k) => v.map(x => x*k);
const add = (v,w) => v.map((x,i) => x+w[i]);
function draw(){
  const theta = Number(angle.value)*Math.PI/180;
  const a = Number(amplitude.value);
  const normal = [Math.cos(theta),Math.sin(theta)];
  const tangent = [-normal[1],normal[0]];
  const f = 1+a*normal[1];
  const p = add([160,110],[68*normal[0],-68*normal[1]]);
  const tip = ([x,y]) => add(p,[39*x,-39*y]);
  const coord = v => v.join(",");
  const t = mul(tangent,a*normal[0]);
  const n = mul(normal,-f);
  const vectors = {vector:mul(tangent,f), tangent:t, normal:n, derivative:add(t,n)};
  const axis = get("axis");
  const [x1,y1] = tip(mul(tangent,-2)), [x2,y2] = tip(mul(tangent,2));
  for (const [key,value] of Object.entries({x1,y1,x2,y2})) axis.setAttribute(key,value);
  get("point").setAttribute("cx",p[0]);
  get("point").setAttribute("cy",p[1]);
  const zero = Math.hypot(...t)<1e-8;
  get("guide").setAttribute("d",zero ? "" : "M"+coord(tip(t))+"L"+coord(tip(vectors.derivative))+"L"+coord(tip(n)));
  for(const [key,v] of Object.entries(vectors)){
    const end = tip(v);
    const d = end.map((x,i)=>x-p[i]);
    const size = Math.hypot(...d);
    const head = Math.min(7,size/2);
    const [ux,uy] = size ? mul(d,1/size) : [0,0];
    const back = add(end,mul([ux,uy],-head));
    const wing = mul([-uy,ux],head*.5);
    const hidden = size<1e-8 || (zero && key==="derivative");
    get(key).setAttribute("d",hidden ? "" : "M"+coord(p)+"L"+coord(end)+"M"+coord(add(back,wing))+"L"+coord(end)+"L"+coord(add(back,mul(wing,-1))));
    get("row-"+key).querySelectorAll("td").forEach((cell,i)=>{cell.textContent=Math.abs(v[i])<.0005 ? "0.000" : v[i].toFixed(3);});
  }
  get("angle").textContent=angle.value+"°";
  get("amplitude").textContent=a.toFixed(1);
  get("observation").textContent=zero ? "この点では共変微分はゼロ。通常の微分と法線成分は重なる。" : "通常の微分を破線の接線へ正射影すると、共変微分が得られる。";
}
for (const input of [angle,amplitude]) input.addEventListener("input",draw);
draw();
</script>
</html>
