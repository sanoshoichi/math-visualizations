</main><script>
const get=id=>document.getElementById(id);
const blue="var(--blue)",red="var(--red)",green="var(--green)",gray="GrayText";
const rad=x=>x*Math.PI/180;
const fmt=x=>(Math.abs(x)<.0005?0:x).toFixed(3);
const p=(x,y)=>[180+65*x,120-65*y];
const line=(a,b,color=gray,w=1.4,dash="")=>'<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+color+'" stroke-width="'+w+'" stroke-dasharray="'+dash+'"/>';
const label=(x,y,s)=>'<text x="'+x+'" y="'+y+'">'+s+'</text>';
const dot=(a,color=blue)=>'<circle cx="'+a[0]+'" cy="'+a[1]+'" r="4" fill="'+color+'"/>';
const ellipse=(x,y,rx,ry,color=gray)=>'<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
function arrow(a,b,color=blue){
 const dx=b[0]-a[0],dy=b[1]-a[1],n=Math.hypot(dx,dy);
 if(n<.1)return dot(a,color);
 const h=Math.min(8,n/2),x=dx/n,y=dy/n;
 return line(a,b,color,2.5)+line(b,[b[0]-h*x+h*.45*y,b[1]-h*y-h*.45*x],color,2)+line(b,[b[0]-h*x-h*.45*y,b[1]-h*y+h*.45*x],color,2);
}
const trace=(fn,color=blue)=>Array.from({length:65},(_,i)=>fn(i/64)).map((a,i)=>i?line(fn((i-1)/64),a,color,2):"").join("");
const axes=()=>line([28,120],[332,120])+line([180,218],[180,20])+label(326,113,"x")+label(187,26,"y");
const info=(diagram,reading,formula="",extra="")=>({diagram,reading,formula,extra});
const table=(heads,rows)=>"<table><thead><tr>"+heads.map(x=>'<th scope="col">'+x+"</th>").join("")+"</tr></thead><tbody>"+rows.map(row=>"<tr>"+row.map((x,i)=>i?"<td>"+x+"</td>":'<th scope="row">'+x+"</th>").join("")+"</tr>").join("")+"</tbody></table>";

function bracketFigure(h) {
 const result=h*h, y=185-95*result;
 const bars=line([30,185],[335,185])+line([30,185],[30,42])+
   line([90,185],[90,y],blue,10)+dot([225,185],red)+
   line([90,y],[320,y],gray,1,"4 4")+
   arrow([318,185],[318,y],green)+
   label(43,25,"f = y の値を比較")+
   label(49,205,"青：X → Y")+label(184,205,"赤：Y → X")+
   label(101,y-7,result.toFixed(4))+label(238,178,"0")+
   label(291,222,"緑：差");
 return '<section aria-labelledby="bracket-title"><h3 id="bracket-title">関数に作用する Lie 括弧</h3>'+
   '<p>ここでは高さを返す関数 <i>f</i>(<i>x</i>, <i>y</i>) = <i>y</i> を使う。上の二つの終点でこの関数を評価し、青から赤を引く。</p>'+
   '<svg viewBox="0 0 360 235" role="img" aria-label="青の終点の関数値 '+result.toFixed(4)+' と赤の終点の関数値 0 の差">'+bars+'</svg>'+
   '<p>緑の矢印は関数値の差。その差を二つの操作の時間幅の積で割ると、この例では常に 1。下の式は、流れを使わずに方向微分を二回行って同じ値を求める計算である。</p>'+
   '<div class="formula" id="bracket-operator"></div></section>';
}


function sphereCircle(radius,latitudeMode=false) {
 const R=89, cx=119, cy=115, tilt=.36;
 const project=(x,y,z)=>[cx+R*x,cy+R*(Math.sin(tilt)*y-Math.cos(tilt)*z)];
 const point=(r,t)=>project(Math.sin(r)*Math.cos(t),Math.sin(r)*Math.sin(t),Math.cos(r));
 const north=point(0,0), end=point(radius,Math.PI/2);
 const ring=(r,front)=>Array.from({length:96},(_,i)=>{
   const start=i*2*Math.PI/96,end=(i+1)*2*Math.PI/96;
   const depth=Math.cos(tilt)*Math.sin(r)*Math.sin((start+end)/2)+Math.sin(tilt)*Math.cos(r);
   return (depth>=0)===front ? line(point(r,start),point(r,end),blue,2,front?"":"2 3") : "";
 }).join("");
 const equator=trace(t=>point(Math.PI/2,2*Math.PI*t),gray);
 const meridian=trace(t=>point(radius*t,Math.PI/2),green);
 return ellipse(cx,cy,R,R)+equator+ring(radius,false)+ring(radius,true)+
   (latitudeMode?"":meridian)+dot(north,green)+dot(end,blue)+
   label(north[0]+8,north[1]+2,latitudeMode?"北極":"北極 P")+
   (latitudeMode?"":label(225,81,"緑：球面に沿う半径 r"))+
   label(225,110,latitudeMode?"青：選んだ緯線":"青：測地円")+
   label(225,139,"灰：赤道。青の破線：背面");
}
function tidalShape(k,weyl=false) {
 const values=weyl?[1,-1,0]:[.6,-.3,k],t=weyl?k:.5;
 const radii=values.map(v=>38*(1+.5*v*t*t));
 return label(44,36,"方向 1・2 の断面")+label(203,36,"方向 1・3 の断面")+
   ellipse(93,101,38,38,gray)+ellipse(263,101,38,38,gray)+
   ellipse(93,101,radii[0],radii[1],blue)+ellipse(263,101,radii[0],radii[2],blue)+
   label(41,170,"灰：初期形状")+label(196,170,"青：短時間近似");
}
const diagramNotes=[
 ["青：曲線と点 P・Q","赤：P と Q を結ぶ割線の方向","緑：P での接線。赤の傾きがこれに近づく"],
 ["灰：元の座標軸","緑：回した基底 e′₁, e′₂","青：同じベクトル v。緑の基底で測ると成分が変わる"],

 ["時間の行は符号を反転して描く","矢印を符号付きで足すとスカラー曲率。表で Einstein テンソルの成分も確認できる"],
 ["灰：初期の円形断面。青：短時間後の近似","下の二断面で、伸びる方向・縮む方向・係数がゼロの方向を比べる"]
];

const topics=[
["接ベクトル・接空間","曲線上の点 P を固定し、点 Q を P に近づける。赤は割線方向、緑は P での接線。","点の間隔 h",.02,1.3,.02,.9,h=>{
 const P=p(0,0),Q=p(h,h*h/2);
 return info(axes()+trace(t=>p(3*t-1.5,(3*t-1.5)**2/2))+line(p(-1.7,0),p(1.7,0),green,3)+arrow(P,p(1.5,.75*h),red)+dot(P)+dot(Q)+label(168,140,"P")+label(Q[0]+5,Q[1]-6,"Q"),"割線の傾きは "+fmt(h/2)+"。間隔を小さくすると 0 に近づく。","γ(<i>t</i>) = (<i>t</i>, <i>t</i>²/2)　　γ′(0) = (1, 0)");}],
["多様体・座標・座標基底","接平面を拡大した図。ベクトルを固定し、座標基底だけを回す。","基底の回転角",0,180,1,35,a=>{
 const t=rad(a),c=Math.cos(t),s=Math.sin(t);
 return info(axes()+arrow(p(0,0),p(1.4*c,1.4*s),green)+arrow(p(0,0),p(-1.4*s,1.4*c),green)+arrow(p(0,0),p(1,.5)), "青の矢印は同じ。回した基底での成分は ("+fmt(c+.5*s)+", "+fmt(-s+.5*c)+")。","<i>v</i> = <i>v</i>¹<i>e</i>₁ + <i>v</i>²<i>e</i>₂");}],
["ベクトル場・流れ・Lie括弧","青は X を先に、赤は Y を先に行う。X は右への移動、Y は今いる x 座標に応じた上下の移動。どちらも原点から始め、それぞれの操作を時間 h だけ行う。","各流れの時間 h",.05,1.2,.05,.65,h=>{
 const left=[35,170],right=[210,170],dx=86*h,dy=65*h*h;
 const B=[left[0]+dx,170],C=[B[0],170-dy],E=[right[0]+dx,170];
 const diagram=line([180,24],[180,216],gray,1,"4 4")+
   label(25,27,"青：① X → ② Y")+label(200,27,"赤：① Y → ② X")+
   line([22,170],[160,170])+line([35,190],[35,45])+
   line([197,170],[335,170])+line([210,190],[210,45])+
   arrow(left,B,blue)+arrow(B,C,blue)+dot(C,blue)+
   arrow(right,E,red)+dot(right,red)+dot(E,red)+
   label(20,192,"原点")+label(192,192,"原点")+label(199,211,"① Y：x = 0 なので動かない");
 return info(diagram,"左：① X で (h, 0) に進み、② Y で高さが h × h だけ増える。右：① Y の時点では x = 0 なので原点に留まり、② X で (h, 0) に進む。終点の x 座標は同じで、高さの差だけが残る。","<i>X</i> = ∂ₓ　　<i>Y</i> = <i>x</i>∂ᵧ　　[<i>X</i>, <i>Y</i>] = ∂ᵧ",
 table(["経路","終点 x","終点 y"],[["青：X → Y",fmt(h),fmt(h*h)],["赤：Y → X",fmt(h),fmt(0)]])+bracketFigure(h));}],
["双対空間・余ベクトル","縦の線は関数 f = x の等高線。矢印を回して、余ベクトル df が返す値を見る。","矢印の角度",0,360,1,30,a=>{
 const t=rad(a);
 return info([-2,-1,0,1,2].map(x=>line(p(x,-1.4),p(x,1.4))).join("")+arrow(p(0,0),p(1.4*Math.cos(t),1.4*Math.sin(t))),"右向きで正、左向きで負、等高線と平行ならゼロ。現在の値は "+fmt(Math.cos(t))+"。","d<i>f</i>(<i>v</i>) = d<i>x</i>(<i>v</i>) = cos θ");}],
["テンソル・縮約","同じ対称な双線形形式を、回転する正規直交基底で表示する。楕円はその形式の等値線。","基底の回転角",0,180,1,35,a=>{
 const c=Math.cos(rad(a)),s=Math.sin(rad(a)),u=2*c*c+s*s,w=2*s*s+c*c,v=-s*c;
 return info(axes()+ellipse(180,120,65/Math.sqrt(2),65,blue)+arrow(p(0,0),p(c,s),green)+arrow(p(0,0),p(-s,c),green),"成分は変わるが、この正規直交基底での対角成分の和は 3。","tr <i>A</i> = "+fmt(u)+" + "+fmt(w)+" = 3","<h3>回転後の行列 A′</h3>"+table(["成分","1","2"],[["1",fmt(u),fmt(v)],["2",fmt(v),fmt(w)]]));}],
["計量・ローレンツ計量","光速を 1 とした時空図。縦軸を時間、横軸を空間とし、ベクトルの時間成分を固定する。","空間成分",0,1.8,.05,.6,x=>{
 const g=x*x-1;
 return info(line(p(-2,0),p(2,0))+line(p(0,-1.45),p(0,1.45))+line(p(-1.45,-1.45),p(1.45,1.45),green)+line(p(-1.45,1.45),p(1.45,-1.45),green)+arrow(p(0,0),p(x,1))+label(187,29,"時間")+label(318,114,"空間"),"現在のベクトルは "+(Math.abs(g)<1e-8?"光的":g<0?"時間的":"空間的")+"。緑は光の方向。","<i>g</i>(<i>v</i>, <i>v</i>) = −1 + "+fmt(x)+"² = "+fmt(g));}],
["接続・共変微分","単位円の接ベクトルを、角度に応じて伸縮させる。点 P は右端に固定する。","長さの振幅 a",0,.9,.05,.4,a=>{
 const P=p(1,0);
 return info(ellipse(180,120,65,65)+line(p(1,-1.3),p(1,1.3),gray,1,"4 4")+arrow(P,p(1,1),blue)+arrow(P,p(0,a),red)+arrow(P,p(1,a),green)+line(p(0,a),p(1,a),gray,1,"4 4")+dot(P),"緑は接線への射影。赤の通常の微分には、左向きの法線成分も含まれる。","d<i>Y</i>/dθ = (−1, "+fmt(a)+")　　D<i>Y</i>/dθ = (0, "+fmt(a)+")",'<p><a href="../covariant-derivative/">単位円と球面の共変微分を詳しく見る</a></p>');}],
["Levi-Civita 接続・捩率","平坦な平面の極座標を使う。半径を変えて記号の値を比較する。この接続の捩率はゼロで、下付き添字を交換した記号は等しい。","半径 r",.35,2,.05,1,r=>{
 const P=p(r,0);
 return info(axes()+ellipse(180,120,65*r,65*r,green)+dot(P)+arrow(P,[P[0],P[1]-55],blue),"直交座標では記号はすべてゼロ。極座標では下の値になるが、平面の曲率はゼロのまま。","Γ<sup><i>r</i></sup><sub>θθ</sub> = −<i>r</i> = "+fmt(-r)+"　　Γ<sup>θ</sup><sub><i>r</i>θ</sub> = Γ<sup>θ</sup><sub>θ<i>r</i></sub> = "+fmt(1/r));}],
["平行移動","平面内の円弧に沿って、同じ向きの青い矢印を運ぶ。緑は経路の接線方向。","経路上の角度",0,180,1,60,a=>{
 const t=rad(a),x=Math.cos(t),y=Math.sin(t),P=p(x,y);
 return info(ellipse(180,120,65,65)+arrow(p(1,0),p(1.7,.3))+arrow(P,p(x+.7,y+.3))+arrow(P,p(x-.55*y,y+.55*x),green)+dot(P),"経路が曲がっても、平面の平行移動では青い矢印の向きと長さが保たれる。","D<i>V</i>/d<i>t</i> = 0");}],
["測地線・アフィンパラメータ","単位球面を正面から投影した模式図。赤道は大円、選んだ緯線は一般に小円。","緯度",0,70,1,35,a=>{
 const t=rad(a);
 return info(sphereCircle(Math.PI/2-t,true),"緯度 0° の赤道は測地線。一定の速さで緯線をたどると、赤道以外では接平面内にも加速度が残る。","<i>k</i><sub><i>g</i></sub> = |tan φ| = "+fmt(Math.tan(t)));}],
["Riemann 曲率・ホロノミー","単位球の北極と赤道上の二点を結ぶ測地三角形。左は経緯度による経路の模式図、右は出発点の接平面での向きの比較。","赤道上の経度差",10,120,1,90,a=>{
 const t=rad(a),L=[40,180],R=[40+a*.9,180];
 return info(line(L,R,blue,3)+line(L,[40,50],green,3)+line(R,[R[0],50],green,3)+line([40,50],[R[0],50],gray,1,"4 4")+label(40,42,"北極（同じ点）")+label(40,203,"赤道")+label(225,70,"帰着時の向き")+arrow([265,139],[315,139],blue)+arrow([265,139],[265+50*Math.cos(t),139-50*Math.sin(t)],red),"この向きに一周すると、平行移動した矢印は回る。単位球で回転角の大きさは囲んだ面積と等しい。","面積 = "+fmt(t)+"　　回転角 = "+a+"°");}],
["測地線偏差・Jacobi 場","単位球の赤道から北へ進む近接した二本の経線。下の線分は、同じ緯度で測った経線間の距離。","進んだ角度",0,90,1,40,a=>{
 const t=rad(a),w=52*Math.cos(t);

 if (current === 2) displayEquation("bracket-operator","Yf = x → X(Yf) = 1<br>Xf = 0 → Y(Xf) = 0<br>[X,Y]f = 1 − 0 = 1","\\begin{aligned}Yf&=x\\,\\partial_y y=x,& X(Yf)&=\\partial_x x=1,\\\\ Xf&=\\partial_x y=0,& Y(Xf)&=x\\,\\partial_y 0=0,\\\\ [X,Y]f&=X(Yf)-Y(Xf)=1-0=1.\\end{aligned}");
 showBasisMatrices(x);
 if (current !== 5) displayEquation("calculation",calculations[current](x));
}
const workedSteps = [["割線から接ベクトルへ","差商は点 P から Q への変位を、パラメータの差で割ったもの。接空間はこの曲線の接線一本ではなく、点 P を通るすべての曲線の速度を集めた空間である。","\\begin{aligned}\\gamma(h)-\\gamma(0)&=(h,h^2/2),\\\\ \\frac{\\gamma(h)-\\gamma(0)}h&=(1,h/2)\\xrightarrow{h\\to0}(1,0).\\end{aligned}"],["基底を回したときの成分","新しい基底の二本を列に並べた行列を Q とする。矢印そのものを固定して、その成分だけを求め直す。座標基底 ∂ᵢ は座標関数 xʲ に作用すると、添字が一致する場合だけ 1 を返す。","\\begin{aligned}\\partial_i x^j&=\\delta_i{}^j,\\\\ v&=Qv',\\quad Q^{-1}=Q^{\\mathsf T},\\\\ v'&=\\binom{\\cos\\theta+\\tfrac12\\sin\\theta}{-\\sin\\theta+\\tfrac12\\cos\\theta}.\\end{aligned}"],["二つの流れの順序を入れ替える","Φ は指定したベクトル場に沿って時間 h だけ進める写像。合成は右から適用する。Y の上下方向の速さは、その時点の x 座標で決まる。","\\begin{aligned}\\Phi_X^h(x,y)&=(x+h,y),\\\\ \\Phi_Y^h(x,y)&=(x,y+hx),\\\\ \\Phi_Y^h\\Phi_X^h(0,0)&=(h,h^2),\\\\ \\Phi_X^h\\Phi_Y^h(0,0)&=(h,0),\\\\ [\\partial_x,x\\partial_y]f&=(\\partial_x x)\\partial_y f=\\partial_y f.\\end{aligned}"],["余ベクトルは矢印に数を返す","dx と dy はそれぞれ矢印の横成分と縦成分を取り出す。図の等高線は x が一定の線なので、縦方向に進んでも f は変わらない。","\\begin{aligned}v&=\\cos\\theta\\,\\partial_x+\\sin\\theta\\,\\partial_y,\\\\ \\mathrm df&=\\partial_x f\\,\\mathrm dx+\\partial_y f\\,\\mathrm dy=\\mathrm dx,\\\\ \\mathrm df(v)&=\\cos\\theta.\\end{aligned}"],["基底変換と縮約","Q の列は新しい基底ベクトル。双線形形式にその二本を入力した値が A′ の各成分になる。対角成分を足すときは、正規直交基底なので逆計量が単位行列になる。","\\begin{aligned}A'_{ij}&=\\sum_{a,b}Q_{ai}A_{ab}Q_{bj},\\\\ A'_{11}&=2\\cos^2\\theta+\\sin^2\\theta,\\\\ A'_{22}&=2\\sin^2\\theta+\\cos^2\\theta,\\\\ \\operatorname{tr}A'&=A'_{11}+A'_{22}=3.\\end{aligned}"],["光円錐を分ける境界","図では時間成分が 1。空間成分を動かして、矢印が光の方向と一致する境界を探す。","\\begin{aligned}v&=v^t e_t+v^x e_x,\\quad v^t=1,\\\\ g(v,v)&=(v^x-1)(v^x+1),\\\\ g(v,v)=0&\\iff |v^x|=1.\\end{aligned}"],["単位円で法線成分を取り除く","N は外向き単位法線、T は進行方向の単位接ベクトル。点 P は角度 0 に固定し、角度はラジアンで微分する。","\\begin{aligned}N&=(\\cos\\theta,\\sin\\theta),\\\\ T&=(-\\sin\\theta,\\cos\\theta),\\quad T'=-N,\\\\ Y&=(1+a\\sin\\theta)T=fT,\\\\ Y'&=f'T-fN,\\\\ \\frac{\\mathrm DY}{\\mathrm d\\theta}&=f'T.\\end{aligned}"],["平面を極座標で測る","角度方向の座標基底は半径に比例して長くなる。逆計量は計量行列の逆行列。座標基底では交換子がゼロなので、捩率は接続係数の反対称部分になる。","\\begin{aligned}\\mathrm ds^2&=\\mathrm dr^2+r^2\\mathrm d\\theta^2,\\\\ \\Gamma^r_{\\theta\\theta}&=-\\tfrac12\\partial_r(r^2)=-r,\\\\ \\Gamma^\\theta_{r\\theta}=\\Gamma^\\theta_{\\theta r}&=\\tfrac1{2r^2}\\partial_r(r^2)=1/r,\\\\ T^i{}_{jk}&=\\Gamma^i{}_{jk}-\\Gamma^i{}_{kj}=0.\\end{aligned}"],["経路の接線と運ぶ矢印を区別する","この図は平面の直交座標なので、基底ベクトルの向きは場所で変わらない。緑は円弧の速度、青は平行移動する別のベクトル。","\\begin{aligned}\\gamma(t)&=(\\cos t,\\sin t),\\\\ \\dot\\gamma(t)&=(-\\sin t,\\cos t),\\\\ V(t)&=(0.7,0.3),\\\\ \\frac{\\mathrm DV}{\\mathrm dt}&=\\frac{\\mathrm dV}{\\mathrm dt}=(0,0).\\end{aligned}"],["緯線の加速度を接平面へ射影する","単位球の緯線で、φ は緯度、s は弧長。経度の変化率を使って空間内の加速度を求め、外向き法線 N に沿う成分を引く。","\\begin{aligned}\\frac{\\mathrm d\\theta}{\\mathrm ds}&=\\frac1{\\cos\\phi},\\\\ \\gamma''(s)&=-\\frac{(\\cos\\theta,\\sin\\theta,0)}{\\cos\\phi},\\\\ \\gamma''\\cdot N&=-1,\\\\ \\nabla_{\\gamma'}\\gamma'&=\\gamma''+N,\\quad \\|\\nabla_{\\gamma'}\\gamma'\\|=|\\tan\\phi|.\\end{aligned}"],["三角形の面積と平行移動の回転","経度差を Δθ とし、二本の経線と赤道で囲む。赤道の二つの内角は直角。北極の内角は Δθ。単位球では曲率は 1 なので、角度超過・面積・回転角の大きさが一致する。","\\begin{aligned}A&=\\tfrac\\pi2+\\tfrac\\pi2+\\Delta\\theta-\\pi=\\Delta\\theta,\\\\ |\\Delta\\psi|&=\\int_A K\\,\\mathrm dA=A\\quad(K=1).\\end{aligned}"],["測地線の間隔がどう変わるか","弧長 s を赤道から測る。j は近接する経線の隔たりを初期値で割った、平行な横方向基底での成分。北極に近づくと j がゼロに向かう。","\\begin{aligned}j''+j&=0,\\qquad j(0)=1,\\quad j'(0)=0,\\\\ j(s)&=\\cos s,\\quad j''(s)=-\\cos s.\\end{aligned}"],["測地円の周長に現れる曲率","r は曲面に沿って中心から測る半径。球面では、その測地円を空間内で見た半径は sin r。小さな r では、平面との差の最初の項が曲率に対応する。","\\begin{aligned}L_{\\rm sphere}(r)&=2\\pi\\sin r=2\\pi r-\\tfrac\\pi3r^3+O(r^5),\\\\ L_{\\rm plane}(r)&=2\\pi r,\\\\ L_{\\rm plane}(r)-L_{\\rm sphere}(r)&=\\tfrac\\pi3r^3+O(r^5).\\end{aligned}"],["三方向の潮汐加速度を足す","u は自由落下する基準観測者の四元速度。eᵢ はその観測者と直交する空間の正規直交基底。λᵢ は eᵢ 方向の隔たり一単位あたりの相対加速度。最初に粒子間の相対速度をゼロにして体積の加速度を読む。","\\begin{aligned}\\lambda_i&=g(R(u,e_i)u,e_i),\\\\ \\sum_{i=1}^3\\lambda_i&=-\\operatorname{Ric}(u,u),\\\\ V(\\tau)/V(0)&=1+\\tfrac12(\\lambda_1+\\lambda_2+\\lambda_3)\\tau^2+o(\\tau^2).\\end{aligned}"],["符号付きのトレースから G へ","時間と三つの空間方向を並べた正規直交基底で計算する。時間成分は逆計量で縮約すると負号が付き、G₀₀ を作るときは計量の時間成分が −1 になる。","\\begin{aligned}g^{00}&=-1,\\qquad g^{11}=g^{22}=g^{33}=1,\\\\ R&=-\\operatorname{Ric}_{00}+\\sum_{i=1}^3\\operatorname{Ric}_{ii},\\\\ G_{00}&=\\operatorname{Ric}_{00}+\\tfrac12R.\\end{aligned}"],["トレースゼロでも形は変わる","τ は基準観測者の固有時間。図の三方向の係数は 1、−1、0。時間の二次までなら、横の伸びと縦の縮みが体積では相殺される。","\\begin{aligned}r_i(\\tau)&=1+\\tfrac12\\lambda_i\\tau^2+o(\\tau^2),\\\\ \\lambda_1+\\lambda_2+\\lambda_3&=1-1+0=0,\\\\ V(\\tau)/V(0)&=1+o(\\tau^2).\\end{aligned}"]];
function showWorkedSteps(i) {
 const [title, text, tex] = workedSteps[i];
 get("steps-title").textContent=title;
 get("steps-text").textContent=text;
 displayEquation("steps-math","",tex);
}
function show(i){
 current=i;select.value=String(i);
 const [name,intro,param,min,max,step,value]=topics[i];
 get("title").textContent=(i+1)+". "+name;get("intro").textContent=intro;get("parameter").textContent=param;
 Object.assign(control,{min,max,step,value});
 const [definition, identity, context] = definitions[i];
 get("definition").textContent=definition;
 displayEquation("identity",identity,identityTex[i]);
 showWorkedSteps(i);
 get("calculation-context").innerHTML=context;
 get("calculation-section").hidden=i===5;
 get("prev").disabled=i===0;get("next").disabled=i===topics.length-1;
 history.replaceState(null,"","#"+(i+1));draw();
}
select.addEventListener("change",()=>show(Number(select.value)));
get("prev").addEventListener("click",()=>show(current-1));
get("next").addEventListener("click",()=>show(current+1));
control.addEventListener("input",draw);
function fromHash(){
 const i=Number(location.hash.slice(1))-1;show(Number.isInteger(i)&&i>=0&&i<topics.length?i:0);
}
window.addEventListener("hashchange",fromHash);fromHash();
window.addEventListener("DOMContentLoaded",()=>{displayEquation("identity",definitions[current][1],identityTex[current]);showWorkedSteps(current);draw();});
</script></body></html>
