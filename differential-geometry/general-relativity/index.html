</main><script>
const get=id=>document.getElementById(id);
const blue="var(--blue)",red="var(--red)",green="var(--green)",gray="GrayText";
const rad=x=>x*Math.PI/180;
const fmt=x=>(Math.abs(x)<.0005?0:x).toFixed(3);
const p=(x,y)=>[180+65*x,120-65*y];
const line=(a,b,color=gray,w=1.4,dash="")=>'<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+color+'" stroke-width="'+w+'" stroke-dasharray="'+dash+'"/>';
const label=(x,y,s)=>'<text x="'+x+'" y="'+y+'">'+s+'</text>';
const dot=(a,color=blue)=>'<circle cx="'+a[0]+'" cy="'+a[1]+'" r="4" fill="'+color+'"/>';
const ellipse=(x,y,rx,ry,color=gray)=>'<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
function arrow(a,b,color=blue){
 const dx=b[0]-a[0],dy=b[1]-a[1],n=Math.hypot(dx,dy);
 if(n<.1)return dot(a,color);
 const h=Math.min(8,n/2),x=dx/n,y=dy/n;
 return line(a,b,color,2.5)+line(b,[b[0]-h*x+h*.45*y,b[1]-h*y-h*.45*x],color,2)+line(b,[b[0]-h*x-h*.45*y,b[1]-h*y+h*.45*x],color,2);
}
const trace=(fn,color=blue)=>Array.from({length:65},(_,i)=>fn(i/64)).map((a,i)=>i?line(fn((i-1)/64),a,color,2):"").join("");
const axes=()=>line([28,120],[332,120])+line([180,218],[180,20])+label(326,113,"x")+label(187,26,"y");
const info=(diagram,reading,formula="",extra="")=>({diagram,reading,formula,extra});
const table=(heads,rows)=>"<table><thead><tr>"+heads.map(x=>'<th scope="col">'+x+"</th>").join("")+"</tr></thead><tbody>"+rows.map(row=>"<tr>"+row.map((x,i)=>i?"<td>"+x+"</td>":'<th scope="row">'+x+"</th>").join("")+"</tr>").join("")+"</tbody></table>";
const topics=[
["接ベクトル・接空間","曲線上の点 P を固定し、点 Q を P に近づける。赤は割線方向、緑は P での接線。","点の間隔 h",.02,1.3,.02,.9,h=>{
 const P=p(0,0),Q=p(h,h*h/2);
 return info(axes()+trace(t=>p(3*t-1.5,(3*t-1.5)**2/2))+line(p(-1.7,0),p(1.7,0),green,3)+arrow(P,p(1.5,.75*h),red)+dot(P)+dot(Q)+label(168,140,"P")+label(Q[0]+5,Q[1]-6,"Q"),"割線の傾きは "+fmt(h/2)+"。間隔を小さくすると 0 に近づく。","γ(<i>t</i>) = (<i>t</i>, <i>t</i>²/2)　　γ′(0) = (1, 0)");}],
["多様体・座標・座標基底","接平面を拡大した図。ベクトルを固定し、座標基底だけを回す。","基底の回転角",0,180,1,35,a=>{
 const t=rad(a),c=Math.cos(t),s=Math.sin(t);
 return info(axes()+arrow(p(0,0),p(1.4*c,1.4*s),green)+arrow(p(0,0),p(-1.4*s,1.4*c),green)+arrow(p(0,0),p(1,.5)), "青の矢印は同じ。回した基底での成分は ("+fmt(c+.5*s)+", "+fmt(-s+.5*c)+")。","<i>v</i> = <i>v</i>¹<i>e</i>₁ + <i>v</i>²<i>e</i>₂");}],
["ベクトル場・流れ・Lie括弧","平面上で右向きの移動と、高さの増加率が x に等しい移動を順に行う。青と赤で順序が異なる。","各流れの時間 h",.05,1.2,.05,.65,h=>{
 const A=p(0,0),B=p(h,0),C=p(h,h*h);
 return info(axes()+arrow(A,B,red)+arrow(A,B,blue)+arrow(B,C,blue)+dot(B,red)+dot(C,blue),"右へ動いてから上へ動くと、逆順より終点が "+fmt(h*h)+" だけ高い。差を h² で割ると 1。","<i>X</i> = ∂ₓ　　<i>Y</i> = <i>x</i>∂ᵧ　　[<i>X</i>, <i>Y</i>] = ∂ᵧ");}],
["双対空間・余ベクトル","縦の線は関数 f = x の等高線。矢印を回して、余ベクトル df が返す値を見る。","矢印の角度",0,360,1,30,a=>{
 const t=rad(a);
 return info([-2,-1,0,1,2].map(x=>line(p(x,-1.4),p(x,1.4))).join("")+arrow(p(0,0),p(1.4*Math.cos(t),1.4*Math.sin(t))),"右向きで正、左向きで負、等高線と平行ならゼロ。現在の値は "+fmt(Math.cos(t))+"。","d<i>f</i>(<i>v</i>) = d<i>x</i>(<i>v</i>) = cos θ");}],
["テンソル・縮約","同じ対称な双線形形式を、回転する正規直交基底で表示する。楕円はその形式の等値線。","基底の回転角",0,180,1,35,a=>{
 const c=Math.cos(rad(a)),s=Math.sin(rad(a)),u=2*c*c+s*s,w=2*s*s+c*c,v=-s*c;
 return info(axes()+ellipse(180,120,65/Math.sqrt(2),65,blue)+arrow(p(0,0),p(c,s),green)+arrow(p(0,0),p(-s,c),green),"成分は変わるが、この正規直交基底での対角成分の和は 3。","tr <i>A</i> = "+fmt(u)+" + "+fmt(w)+" = 3",table(["成分","1","2"],[["1",fmt(u),fmt(v)],["2",fmt(v),fmt(w)]]));}],
["計量・ローレンツ計量","光速を 1 とした時空図。縦軸を時間、横軸を空間とし、ベクトルの時間成分を固定する。","空間成分",0,1.8,.05,.6,x=>{
 const g=x*x-1;
 return info(line(p(-2,0),p(2,0))+line(p(0,-1.45),p(0,1.45))+line(p(-1.45,-1.45),p(1.45,1.45),green)+line(p(-1.45,1.45),p(1.45,-1.45),green)+arrow(p(0,0),p(x,1))+label(187,29,"時間")+label(318,114,"空間"),"現在のベクトルは "+(Math.abs(g)<1e-8?"光的":g<0?"時間的":"空間的")+"。緑は光の方向。","<i>g</i>(<i>v</i>, <i>v</i>) = −1 + "+fmt(x)+"² = "+fmt(g));}],
["接続・共変微分","単位円の接ベクトルを、角度に応じて伸縮させる。点 P は右端に固定する。","長さの振幅 a",0,.9,.05,.4,a=>{
 const P=p(1,0);
 return info(ellipse(180,120,65,65)+line(p(1,-1.3),p(1,1.3),gray,1,"4 4")+arrow(P,p(1,1),blue)+arrow(P,p(0,a),red)+arrow(P,p(1,a),green)+line(p(0,a),p(1,a),gray,1,"4 4")+dot(P),"緑は接線への射影。赤の通常の微分には、左向きの法線成分も含まれる。","d<i>Y</i>/dθ = (−1, "+fmt(a)+")　　D<i>Y</i>/dθ = (0, "+fmt(a)+")",'<p><a href="../covariant-derivative/">単位円と球面の共変微分を詳しく見る</a></p>');}],
["Levi-Civita 接続・捩率","平坦な平面の極座標を使う。半径を変えて記号の値を比較する。この接続の捩率はゼロで、下付き添字を交換した記号は等しい。","半径 r",.35,2,.05,1,r=>{
 const P=p(r,0);
 return info(axes()+ellipse(180,120,65*r,65*r,green)+dot(P)+arrow(P,[P[0],P[1]-55],blue),"直交座標では記号はすべてゼロ。極座標では下の値になるが、平面の曲率はゼロのまま。","Γ<sup><i>r</i></sup><sub>θθ</sub> = −<i>r</i> = "+fmt(-r)+"　　Γ<sup>θ</sup><sub><i>r</i>θ</sub> = Γ<sup>θ</sup><sub>θ<i>r</i></sub> = "+fmt(1/r));}],
["平行移動","平面内の円弧に沿って、同じ向きの青い矢印を運ぶ。緑は経路の接線方向。","経路上の角度",0,180,1,60,a=>{
 const t=rad(a),x=Math.cos(t),y=Math.sin(t),P=p(x,y);
 return info(ellipse(180,120,65,65)+arrow(p(1,0),p(1.7,.3))+arrow(P,p(x+.7,y+.3))+arrow(P,p(x-.55*y,y+.55*x),green)+dot(P),"経路が曲がっても、平面の平行移動では青い矢印の向きと長さが保たれる。","D<i>V</i>/d<i>t</i> = 0");}],
["測地線・アフィンパラメータ","単位球面を正面から投影した模式図。赤道は大円、選んだ緯線は一般に小円。","緯度",0,70,1,35,a=>{
 const t=rad(a);
 return info(ellipse(180,120,88,88)+line([92,120],[268,120],gray,1,"4 4")+line([180-88*Math.cos(t),120-88*Math.sin(t)],[180+88*Math.cos(t),120-88*Math.sin(t)],blue,3),"緯度 0° の赤道は測地線。一定の速さで緯線をたどると、赤道以外では接平面内にも加速度が残る。","<i>k</i><sub><i>g</i></sub> = |tan φ| = "+fmt(Math.tan(t)));}],
["Riemann 曲率・ホロノミー","単位球の北極と赤道上の二点を結ぶ測地三角形。左は経緯度による経路の模式図、右は出発点の接平面での向きの比較。","赤道上の経度差",10,120,1,90,a=>{
 const t=rad(a),L=[40,180],R=[40+a*.9,180];
 return info(line(L,R,blue,3)+line(L,[40,50],green,3)+line(R,[R[0],50],green,3)+line([40,50],[R[0],50],gray,1,"4 4")+label(40,42,"北極（同じ点）")+label(40,203,"赤道")+label(225,70,"帰着時の向き")+arrow([265,139],[315,139],blue)+arrow([265,139],[265+50*Math.cos(t),139-50*Math.sin(t)],red),"この向きに一周すると、平行移動した矢印は回る。単位球で回転角の大きさは囲んだ面積と等しい。","面積 = "+fmt(t)+"　　回転角 = "+a+"°");}],
["測地線偏差・Jacobi 場","単位球の赤道から北へ進む近接した二本の経線。下の線分は、同じ緯度で測った経線間の距離。","進んだ角度",0,90,1,40,a=>{
 const t=rad(a),w=52*Math.cos(t);
 return info(ellipse(180,105,81,81)+trace(z=>[180-52*Math.cos(z*Math.PI/2),105-81*Math.sin(z*Math.PI/2)],blue)+trace(z=>[180+52*Math.cos(z*Math.PI/2),105-81*Math.sin(z*Math.PI/2)],blue)+dot([180-w,105-81*Math.sin(t)])+dot([180+w,105-81*Math.sin(t)])+line([180-w,207],[180+w,207],red,3),"赤道での間隔を 1 とすると、現在の間隔の比は "+fmt(Math.cos(t))+"。北極で経線は合流する。","<i>J</i>(<i>s</i>)/<i>J</i>(0) = cos <i>s</i>");}],
["断面曲率・Gauss 曲率","単位球と平面で、同じ測地半径の円の周長を比べる。線分の長さはそれぞれの周長に比例する。","測地半径 r",.1,1.5,.05,.9,r=>{
 const s=Math.sin(r);
 return info(label(35,75,"単位球")+line([35,94],[35+175*s,94],blue,5)+label(35,145,"平面")+line([35,164],[35+175*r,164],green,5),"球上の周長は "+fmt(2*Math.PI*s)+"、平面では "+fmt(2*Math.PI*r)+"。球上のほうが短い。","<i>L</i><sub>球</sub> = 2π sin <i>r</i>　　<i>L</i><sub>平面</sub> = 2π<i>r</i>",'<p><a href="../surface-curvature/">法曲率と Gauss 曲率の断面図を開く</a></p>');}],
["Ricci テンソル","自由落下する粒子群を、局所的な三つの直交方向で見る。青・赤・緑は方向別の相対加速度係数。正は伸び、負は縮み。","第3方向の係数",-.9,.9,.05,-.3,k=>{
 const values=[.6,-.3,k],total=values.reduce((a,b)=>a+b,0);
 return info(line([180,28],[180,210])+values.map((v,i)=>label(28,59+i*57,"方向 "+(i+1))+arrow([180,55+i*57],[180+120*v,55+i*57],[blue,red,green][i])).join(""),"三方向の和は "+fmt(total)+"。初期の相対速度がゼロなら、この和は体積の初期加速度を初期体積で割った値になる。","−Ric(<i>u</i>, <i>u</i>) = "+values.map(x=>"("+fmt(x)+")").join(" + ")+" = "+fmt(total));}],
["スカラー曲率・Einstein テンソル","局所正規直交基底で Ricci テンソルが対角形の例。時間成分は計量の符号が負なので、トレースを取るときに符号を反転する。","Ricci の時間成分", -2,2,.1,1,q=>{
 const vals=[q,1,2,0],sum=3-q,con=[-q,1,2,0];
 return info(line([180,25],[180,220])+con.map((v,i)=>label(25,50+i*49,["時間","空間1","空間2","空間3"][i])+arrow([180,46+i*49],[180+60*v,46+i*49],i===0?red:blue)).join(""),"矢印は符号を反映した各成分。足し合わせたスカラー曲率は "+fmt(sum)+"。","<i>R</i> = −<i>R</i>₀₀ + <i>R</i>₁₁ + <i>R</i>₂₂ + <i>R</i>₃₃　　<i>G</i> = Ric − ½<i>R g</i>",table(["方向","Ric の対角成分","G の対角成分"],vals.map((v,i)=>[i===0?"時間":"空間 "+i,fmt(v),fmt(v-(i===0?-1:1)*sum/2)])));}],
["Weyl 曲率","真空の潮汐作用を表す局所モデル。初期の球を、横に伸ばし縦に縮める。奥行き方向の係数はゼロとする。","経過時間 τ（短時間）",0,.65,.01,.55,t=>{
 const a=t*t/2;
 return info(ellipse(180,120,65,65,gray)+ellipse(180,120,65*(1+a),65*(1-a),blue)+line(p(-1.6,0),p(1.6,0),gray,1,"4 4"),"灰色は初期形状、青は短時間近似。方向別の初期相対加速度係数の和はゼロだが、形は変わる。","(+1) + (−1) + 0 = 0");}]
];
const definitions = [["曲線の速度として接ベクトルを表す。同じ点を通る曲線のうち、その点での速度が同じものは同じ接ベクトルを表す。点 P で可能な速度全体が接空間である。","<i>v</i> = γ′(0) = lim<sub><i>h</i>→0</sub> [γ(<i>h</i>) − γ(0)]/<i>h</i>","曲線 γ(<i>t</i>) = (<i>t</i>, <i>t</i>²/2) の差商を計算する。"],["座標は多様体の近傍を開集合へ写す。座標基底は各座標だけを変えた曲線の速度である。図では接平面上の正規直交基底を回す。","<i>v</i> = Σ<sub><i>i</i></sub> <i>v</i><sup><i>i</i></sup> ∂<sub><i>i</i></sub>　　<i>v</i>′ = <i>Q</i><sup>T</sup><i>v</i>","元の基底で (1, 0.5) の矢印を、新しい基底に射影する。"],["流れはベクトル場を速度とする移動である。Lie 括弧は、二つのベクトル場を微分作用素として作用させたときの交換子である。","[<i>X</i>, <i>Y</i>](<i>f</i>) = <i>X</i>(<i>Yf</i>) − <i>Y</i>(<i>Xf</i>)","図の二つの順序で得た終点の差を、時間幅の積で割る。"],["余ベクトルは接ベクトルを実数に写す線形写像。関数の微分は、その方向に沿う変化率を返す余ベクトルである。","d<i>f</i><sub><i>p</i></sub>(<i>v</i>) = Σ<sub><i>i</i></sub> (∂<sub><i>i</i></sub><i>f</i>)(<i>p</i>) <i>v</i><sup><i>i</i></sup>","図では f = x なので、矢印の x 成分だけが寄与する。"],["テンソルはベクトルや余ベクトルを入力に取る多重線形写像。縮約では上付きと下付きの添字を一組選んで和を取る。図は Euclid 計量で双線形形式の一つの添字を上げた例。","<i>A</i>′ = <i>Q</i><sup>T</sup><i>AQ</i>　　tr <i>A</i> = Σ<sub><i>i</i></sub> <i>A</i><sup><i>i</i></sup><sub><i>i</i></sub>","角度を変えて対角成分の変化と、その和を比べる。"],["計量は各接空間上の対称な非退化双線形形式。Lorentz 計量では時間方向を負とする符号規約を用いる。","<i>g</i>(<i>u</i>,<i>v</i>) = <i>g</i><sub>μν</sub><i>u</i><sup>μ</sup><i>v</i><sup>ν</sup>","時間成分は 1。空間成分だけを動かして、光円錐の内外と符号を比べる。"],["接続はベクトル場を別のベクトル場の方向に微分する規則。微分する場を関数倍するときは Leibniz 則に従う。","∇<sub><i>X</i></sub>(<i>fY</i>) = <i>X</i>(<i>f</i>)<i>Y</i> + <i>f</i>∇<sub><i>X</i></sub><i>Y</i>","単位円では、周囲の平面での微分から法線成分を除く。"],["Levi-Civita 接続は計量を保つ捩率ゼロの接続。座標基底の交換子はゼロなので、捩率ゼロならクリストッフェル記号の下付き添字は対称になる。","<i>T</i>(<i>X</i>,<i>Y</i>) = ∇<sub><i>X</i></sub><i>Y</i> − ∇<sub><i>Y</i></sub><i>X</i> − [<i>X</i>,<i>Y</i>]<br>Γ<sup><i>i</i></sup><sub><i>jk</i></sub> = ½ <i>g</i><sup><i>iℓ</i></sup>(∂<sub><i>j</i></sub><i>g</i><sub><i>kℓ</i></sub> + ∂<sub><i>k</i></sub><i>g</i><sub><i>jℓ</i></sub> − ∂<sub><i>ℓ</i></sub><i>g</i><sub><i>jk</i></sub>)","極座標では g<sub>θθ</sub> = r² を微分して記号を求める。"],["曲線に沿うベクトルの共変微分がゼロなら、そのベクトルは平行移動されている。","D<i>V</i><sup><i>i</i></sup>/d<i>t</i> = d<i>V</i><sup><i>i</i></sup>/d<i>t</i> + Γ<sup><i>i</i></sup><sub><i>jk</i></sub>γ̇<sup><i>j</i></sup><i>V</i><sup><i>k</i></sup> = 0","平面の直交座標では接続の補正はゼロ。経路の接線と、運ぶ矢印の成分を比べる。"],["アフィンパラメータで表した測地線では、速度が曲線に沿って平行移動される。単位球の空間的な例では弧長がアフィンパラメータになる。","∇<sub>γ̇</sub>γ̇ = 0　　γ̈<sup><i>i</i></sup> + Γ<sup><i>i</i></sup><sub><i>jk</i></sub>γ̇<sup><i>j</i></sup>γ̇<sup><i>k</i></sup> = 0","緯線を単位速度で進むとき、接平面内の加速度の大きさを求める。"],["Riemann 曲率は共変微分の交換差から、微分方向の非可換性による項を引いたもの。ホロノミーは閉経路に沿う平行移動が出発点の接空間に及ぼす変換である。","<i>R</i>(<i>X</i>,<i>Y</i>)<i>Z</i> = ∇<sub><i>X</i></sub>∇<sub><i>Y</i></sub><i>Z</i> − ∇<sub><i>Y</i></sub>∇<sub><i>X</i></sub><i>Z</i> − ∇<sub>[<i>X</i>,<i>Y</i>]</sub><i>Z</i>","図の測地三角形では単位球の K が 1。回転角の大きさは面積に等しい。"],["Jacobi 場は、測地線の族を変化させたときの無限小の隔たり。測地線偏差方程式は、その隔たりの共変加速度を曲率で与える。","D²<i>J</i>/d<i>s</i>² = <i>R</i>(γ̇,<i>J</i>)γ̇","単位球の経線では、横方向の符号付き成分 j が j″ = −j を満たす。赤道で j(0)=1、j′(0)=0 とする。"],["断面曲率は接空間の二次元平面に割り当てる曲率。以下の式は Riemann 計量の場合。二次元では接平面全体の断面曲率が Gauss 曲率になる。","<i>K</i>(<i>u</i>,<i>v</i>) = <i>g</i>(<i>R</i>(<i>u</i>,<i>v</i>)<i>v</i>,<i>u</i>) / [<i>g</i>(<i>u</i>,<i>u</i>)<i>g</i>(<i>v</i>,<i>v</i>) − <i>g</i>(<i>u</i>,<i>v</i>)²]","図では、同じ測地半径での周長の差を計算する。"],["Ricci テンソルは Riemann 曲率の一つの縮約。ここでは R(X,Y)Z の成分を R<sup>ρ</sup><sub>σμν</sub> とし、μ、ν が X、Y に対応する。","Ric<sub>σν</sub> = <i>R</i><sup>ρ</sup><sub>σρν</sub>","時間的単位ベクトル u に沿う観測者が測った、三方向の潮汐加速度係数を足す。"],["スカラー曲率は逆計量を使って Ricci を縮約したもの。Einstein テンソルは Ricci から計量に比例する項を引いて作る。","<i>R</i> = <i>g</i><sup>μν</sup> Ric<sub>μν</sub>　　<i>G</i><sub>μν</sub> = Ric<sub>μν</sub> − ½ <i>R g</i><sub>μν</sub>","表の時間成分には g₀₀ = −1 を使う。"],["Weyl テンソルは Riemann 曲率の全トレースを除いた部分。四次元で Ricci がゼロの真空領域では Riemann 曲率と一致する。","<i>C</i><sup>ρ</sup><sub>σρν</sub> = 0　　Ric = 0 ⇒ <i>C</i> = Riemann","図は方向別の初期係数が (+1, −1, 0) の短時間モデル。球の半径を 1 とし、横と縦の半径を時間の二次まで計算する。"]];

const select=get("topic"),control=get("control");let current=0;
topics.forEach(([name],i)=>{const option=document.createElement("option");option.value=String(i);option.textContent=(i+1)+". "+name;select.append(option);});
function draw(){
 const x=Number(control.value),model=topics[current][7](x);
 get("setting").textContent=control.value;
 get("figure").innerHTML=model.diagram;
 get("readout").textContent=model.reading;
 get("formula").innerHTML=model.formula;
 get("extra").innerHTML=model.extra;
 get("calculation").innerHTML=calculations[current](x);
}
function show(i){
 current=i;select.value=String(i);
 const [name,intro,param,min,max,step,value]=topics[i];
 get("title").textContent=(i+1)+". "+name;get("intro").textContent=intro;get("parameter").textContent=param;
 Object.assign(control,{min,max,step,value});
 const [definition, identity, context] = definitions[i];
 get("definition").textContent=definition;
 get("identity").innerHTML=identity;
 get("calculation-context").innerHTML=context;
 get("prev").disabled=i===0;get("next").disabled=i===topics.length-1;
 history.replaceState(null,"","#"+(i+1));draw();
}
select.addEventListener("change",()=>show(Number(select.value)));
get("prev").addEventListener("click",()=>show(current-1));
get("next").addEventListener("click",()=>show(current+1));
control.addEventListener("input",draw);
function fromHash(){
 const i=Number(location.hash.slice(1))-1;show(Number.isInteger(i)&&i>=0&&i<topics.length?i:0);
}
